<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=3840" />
<title>ক্লাস কুইজ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 3840px;
    height: 2160px;
    overflow: hidden;
    font-family: 'Noto Sans Bengali', sans-serif;
  }

  .screen {
    position: relative;
    width: 3840px;
    height: 2160px;
    background-color: #130244;
    overflow: hidden;
  }

  /* ── Star Field ── */
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
  }

  /* ── Header bar ── */
  .header {
    position: absolute;
    top: 64px;
    left: 64px;
    right: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 64px;
  }

  /* Close button pill */
  .close-btn {
    background: #f4f4f6;
    border: 2px solid #c3c6cc;
    border-bottom-width: 6px;
    border-radius: 1000px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .close-btn-inner {
    background: #f4f4f6;
    backdrop-filter: blur(50px);
    border-radius: 1000px;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .close-icon {
    width: 72px;
    height: 72px;
    position: relative;
  }

  .close-icon svg {
    width: 100%;
    height: 100%;
  }

  /* Title */
  .title {
    font-size: 111px;
    font-weight: 700;
    color: white;
    line-height: 1.48;
    white-space: nowrap;
  }

  /* Header right meta */
  .header-right {
    display: flex;
    align-items: center;
    gap: 26px;
  }

  .meta-text {
    font-size: 56px;
    font-weight: 600;
    color: white;
    line-height: 1.48;
    white-space: nowrap;
  }

  .dot {
    width: 16px;
    height: 16px;
    background: white;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Question number pill ── */
  .q-pill {
    position: absolute;
    top: 292px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 32px 64px;
    border-radius: 111px;
    background: #130245;
    box-shadow: inset 1px 1px 32px 0px rgba(255,255,255,0.25);
    white-space: nowrap;
    z-index: 10;
  }

  .q-number {
    font-size: 80px;
    font-weight: 700;
    color: white;
    line-height: 1.48;
  }

  .q-number span.muted {
    color: #8c929c;
  }

  .progress-track {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .progress-seg {
    width: 240px;
    height: 32px;
    border-radius: 1111px;
  }

  .progress-seg.done {
    background: #1ca63e;
  }

  .progress-seg.current {
    background: linear-gradient(to right, #e8c8c8, #ffe8e8, #ffffff);
  }

  .progress-seg.empty {
    background: rgba(255,255,255,0.2);
  }

  /* ── Question card ── */
  .question-card {
    position: absolute;
    top: 365px;
    left: 50%;
    transform: translateX(-50%);
    width: 3400px;
    background: #221066;
    border-radius: 140px;
    padding: 200px 120px 120px 120px;
    min-height: 1415px;
  }

  .question-text {
    font-size: 200px;
    font-weight: 700;
    color: white;
    line-height: 1.4;
    width: 100%;
  }

  /* ── Show Options button ── */
  .show-options-btn {
    position: absolute;
    bottom: 180px;
    right: 220px;
    display: flex;
    align-items: center;
    gap: 35px;
    padding: 48px 64px;
    background: #e2008d;
    border: 5.887px solid #ac005b;
    border-bottom-width: 17.662px;
    border-radius: 64px;
    cursor: pointer;
    user-select: none;
  }

  .show-options-btn:active {
    transform: translateY(4px);
    border-bottom-width: 8px;
  }

  .show-options-icon {
    width: 88px;
    height: 88px;
    flex-shrink: 0;
  }

  .show-options-icon svg {
    width: 100%;
    height: 100%;
  }

  .show-options-text {
    font-size: 72px;
    font-weight: 700;
    color: white;
    line-height: 1.48;
    white-space: nowrap;
  }
</style>
</head>
